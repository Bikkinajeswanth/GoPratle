# Render Blueprint for the API (Dashboard → New → Blueprint, or create the Web Service manually
# with the same settings). Secrets are marked `sync: false` so Render asks for them; never commit values.
services:
  - type: web
    name: gopratle-requirements-api
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev: TypeScript is a devDependency and is needed to build even when NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Skip the test-only MongoDB binary download during install.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: gopratle
      - key: FRONTEND_URL
        sync: false
